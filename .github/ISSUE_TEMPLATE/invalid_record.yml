name: Invalid alignment record
description: Report a JSON, PAF, or SAM record that hcp-align accepts or rejects incorrectly.
title: "[Record]: "
labels: ["bug", "verification"]
body:
  - type: dropdown
    id: format
    attributes:
      label: Record format
      options: [JSON v2, JSONL v2, PAF, SAM]
    validations:
      required: true
  - type: textarea
    id: record
    attributes:
      label: Minimal record
      description: Remove unrelated headers and records, but retain every field needed to reproduce the result.
      render: text
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Query and target sources
      description: Include the smallest FASTA/FASTQ or inline sequences that resolve the record IDs.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Verification command
      render: shell
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: Expected check and status
      description: State which structure, score, tag, integrity, or optimality check should pass or fail.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hcp-align version
    validations:
      required: true

[package]
name = "hcp-dp"
version = "0.2.0-alpha.1"
edition = "2021"
autobins = false
autoexamples = false
autobenches = false
rust-version = "1.88"
license = "MIT"
authors = ["Logan Nye"]
description = "Exact alignment reference generation, verification, and backend comparison."
repository = "https://github.com/logannye/hcp-dp"
homepage = "https://github.com/logannye/hcp-dp#readme"
readme = "README.md"
keywords = ["dynamic-programming", "alignment", "bioinformatics", "algorithms"]
categories = ["algorithms", "science", "data-structures"]

[lib]
name = "hcp_dp"
path = "src/lib.rs"

[[bin]]
name = "hcp-align"
path = "src/bin/hcp_align.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rayon = { version = "1.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = { version = "0.1", optional = true }
[dev-dependencies]
criterion = "0.5"
rand = "0.8"
proptest = "1"

[[bench]]
name = "oracle_perf"
harness = false

[features]
parallel = ["rayon"]
tracing = ["dep:tracing"]
experimental-hcp = []

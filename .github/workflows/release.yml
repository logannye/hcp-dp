name: Publish release

on:
  push:
    tags:
      - "v0.2.*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Require a verified signed annotated tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_release_tag.py \
            --tag "${GITHUB_REF_NAME}" \
            --expected-commit "$(git rev-parse HEAD)"
      - name: Validate tag and package versions
        run: python scripts/check_release_versions.py --tag "${GITHUB_REF_NAME}"
      - name: Enforce stable-release adoption and scheduled performance history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/check_adoption_gate.py --tag "${GITHUB_REF_NAME}"
          python scripts/check_rss_history.py --tag "${GITHUB_REF_NAME}"
          python scripts/check_rc_observation.py --tag "${GITHUB_REF_NAME}"
      - name: Validate schemas and differential policy
        run: |
          python scripts/check_differential_allowlist.py
          cargo test --locked --all-targets

  build:
    needs: validate
    uses: ./.github/workflows/artifact-dry-run.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  rss:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - run: cargo build --release --locked --bin hcp-align
      - run: python scripts/rss_gate.py --output rss-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-rss-report
          path: rss-report.json

  differential:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - run: cargo test --locked --manifest-path tools/differential/Cargo.toml
      - run: |
          git clone --filter=blob:none https://github.com/smarco/WFA2-lib.git "$RUNNER_TEMP/WFA2-lib"
          git -C "$RUNNER_TEMP/WFA2-lib" checkout bcf473a6561fa297934a80eaa7c04b4ee412360c
          scripts/build-wfa2-adapter.sh "$RUNNER_TEMP/WFA2-lib" target/wfa2-adapter
          cargo run --locked --manifest-path tools/differential/Cargo.toml -- contract \
            --left internal:auto --right "wfa2:$PWD/target/wfa2-adapter" \
            --max-length 3 \
            --output differential-report.json
          python scripts/check_differential_allowlist.py --report differential-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-differential-report
          path: differential-report.json

  performance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - name: Run enforced Criterion baselines
        env:
          PERF_ENFORCE: "1"
        run: |
          cargo bench --locked --bench oracle_perf
          python scripts/check_bench.py
          python scripts/perf_report.py
      - uses: actions/upload-artifact@v6
        with:
          name: release-performance-report
          path: |
            target/hcp-dp-report/performance-report.json
            target/hcp-dp-report/performance-report.md

  external-validation:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pinned informational validators
        run: python -m pip install 'parasail==1.3.4' 'edlib==1.3.9.post1'
      - name: Reject malformed translations or untriaged discrepancies
        run: |
          python scripts/validate_external.py --required
          python scripts/validate_schema.py \
            schemas/hcp-align.external-validation.v1.schema.json \
            target/hcp-dp-report/external-validation-report.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-external-validation-report
          path: target/hcp-dp-report/external-validation-report.json

  github-release:
    needs: [build, rss, differential, performance, external-validation]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: downloaded-assets
          merge-multiple: true
      - name: Stage a flat release asset set
        run: |
          set -euo pipefail
          mkdir release-assets
          find downloaded-assets -type f \( -name '*.tar.gz' -o -name '*.whl' -o -name '*.spdx.json' -o -name '*-report.json' -o -name '*-report.md' \) \
            -exec cp {} release-assets/ \;
          cp LICENSE docs/migration-v2.md schemas/hcp-align.v2.schema.json \
            schemas/hcp-align.differential.v1.schema.json \
            schemas/hcp-align.external-validation.v1.schema.json release-assets/
      - name: Consolidate checksums
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: Sign checksum manifest with keyless OIDC
        run: cosign sign-blob --yes --bundle release-assets/SHA256SUMS.sigstore.json release-assets/SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.whl
            release-assets/SHA256SUMS
      - name: Create GitHub release from tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${flags[@]}"

  pypi:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: hcp-align-*
          path: wheel-assets
          merge-multiple: true
      - name: Deduplicate identical wheel artifacts
        run: |
          mkdir dist
          find wheel-assets -name '*.whl' -exec cp -n {} dist/ \;
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  crates-io:
    if: github.ref_name != 'v0.2.0-alpha.2'
    needs: github-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

name: Release Validation Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-report:
    name: External validation and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install external validators
        run: python -m pip install 'parasail==1.3.4' 'edlib==1.3.9.post1'
      - name: Validate HCP-DP scores against external libraries
        run: |
          python scripts/validate_external.py --required
          python scripts/validate_schema.py \
            schemas/hcp-align.external-validation.v1.schema.json \
            target/hcp-dp-report/external-validation-report.json
      - name: Generate correctness and performance report
        run: |
          cargo bench --locked --bench oracle_perf
          python scripts/perf_report.py
      - name: Upload report artifact
        uses: actions/upload-artifact@v6
        with:
          name: hcp-dp-release-report
          path: target/hcp-dp-report/

name: Feature request
description: Suggest an oracle workflow, format improvement, or validation target.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What are you trying to do that HCP-DP does not support well yet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe how the change improves exact solving, verification, or comparison.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - hcp-align CLI
        - Rust library API
        - Record verification
        - Backend comparison
        - Differential corpus or benchmarks
        - Experimental HCP engine
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Correctness or validation notes
      description: Are there baseline tools, datasets, or known examples that should verify this feature?
